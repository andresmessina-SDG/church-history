/* Layout: one living river spans the page as the hero; entering an era shrinks the stage to a river band, the era name lands under it, and the story rises below.
   Light only, by choice, for this study. Three skins redefine the same tokens. */
:root{
  color-scheme: light;
  --paper:#ECE8DC; --ink:#2B2620; --muted:#6B6355; --water:#2F4E9E; --accent:#A8321F; --gold:#B08226;
  --rule:rgba(43,38,32,.18); --card:rgba(255,255,255,.34); --gloss:#386E54;
  --display:'IM Fell English', 'Iowan Old Style', Georgia, serif;
  --body:'Spectral', Georgia, 'Times New Roman', serif;
  --label:'IM Fell English SC', 'IM Fell English', Georgia, serif;
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32  0 0 0 0 .26  0 0 0 0 .16  0 0 0 .075 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --stage-h:clamp(480px, 68vh, 640px);
  --ease:cubic-bezier(.65,0,.35,1);
  /* motion tokens (after Emil Kowalski's curves): arrivals and departures ease out; movement on screen eases in and out */
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-in-out:cubic-bezier(.77,0,.175,1);
}
:root[data-skin="engraved"]{
  --paper:#F3F4EF; --ink:#1F2A2A; --muted:#58625F; --water:#2F6E64; --accent:#97482A; --gold:#9C7428;
  --rule:rgba(31,42,42,.2); --card:rgba(255,255,255,.6);
  --display:'Cormorant Garamond', Garamond, Georgia, serif;
  --grain:none;
}
:root[data-skin="fresco"]{
  --paper:#F5F3EE; --ink:#2C2A33; --muted:#6A6670; --water:#3F7FAD; --accent:#A8662A; --gold:#C2952F;
  --rule:rgba(44,42,51,.16); --card:rgba(255,255,255,.5);
  --display:'Marcellus', 'Trajan Pro', Georgia, serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--paper); overflow-x:clip}
body{margin:0; background:var(--paper) var(--grain); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.6; }
button{font:inherit; color:inherit; -webkit-tap-highlight-color:transparent; touch-action:manipulation}
:focus-visible{outline:2px solid var(--water); outline-offset:3px; border-radius:4px}

.page{max-width:1320px; margin:0 auto; padding-inline:clamp(16px,3vw,40px); padding-block:28px 72px}

.top{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:18px 40px; margin-bottom:10px}
.eyebrow{font-family:var(--label); letter-spacing:.05em; font-size:1rem; color:var(--accent); line-height:1.45; text-wrap:balance}
h1{font-family:var(--display); font-weight:400; font-size:clamp(2.5rem,5.4vw,4.4rem); line-height:1; margin:.12em 0 .18em; letter-spacing:-.01em; text-wrap:balance}
.lede{font-style:italic; color:var(--muted); margin:0; max-width:52ch}
.lede cite{font-style:normal; font-family:var(--label); font-size:1rem; letter-spacing:.03em; color:var(--accent); margin-left:.35em; white-space:nowrap}

.controls{display:flex; flex-direction:column; gap:10px; align-items:flex-end}
.seg{display:inline-flex; border:1px solid var(--rule); border-radius:999px; padding:3px; background:var(--card)}
.seg button{border:0; background:none; padding:6px 14px; border-radius:999px; cursor:pointer; font-family:var(--label); font-size:.86rem; letter-spacing:.05em; color:var(--muted); transition:background .3s, color .3s}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.legend{display:inline-flex; gap:8px; align-items:center; margin:0; font-family:var(--label); font-size:1rem; letter-spacing:.05em; color:var(--muted)}
.swatch-gold{display:inline-block; width:22px; height:2px; background:var(--gold); box-shadow:0 0 6px var(--gold); vertical-align:middle}

/* Stage */
/* the river always fits the window: no horizontal scrolling */
.stage-scroll{overflow:hidden}
/* The opening view is the river itself: full bleed, a full screen high, with the title written on the vellum beside the spring */
.stage{position:relative; --gut:max(clamp(16px,3vw,40px), calc((100% - 1320px) / 2 + clamp(16px,3vw,40px)))}
.stage-inner{position:relative; min-width:0; height:100vh; height:100svh; min-height:540px; transition:height .8s var(--ease-in-out)}
.stage-inner::before{content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse 75% 70% at 46% 52%, rgba(120,86,34,0) 55%, rgba(120,86,34,.10) 100%),
             linear-gradient(to bottom, rgba(120,86,34,0) 80%, rgba(120,86,34,.05));
  transition:opacity .6s var(--ease-out)}
.is-era .stage-inner::before{opacity:0}
.title-card{position:absolute; left:var(--gut); bottom:clamp(24px,5vh,56px); max-width:min(48%,600px); pointer-events:none;
  text-shadow:0 0 14px var(--paper), 0 0 28px var(--paper); transition:opacity .3s var(--ease-out), transform .3s var(--ease-out)}
.title-card h1{font-size:clamp(3rem,7.2vw,6.4rem); margin:.06em 0 .14em}
.title-card .lede{max-width:34ch}
.corner{position:absolute; right:var(--gut); bottom:clamp(24px,5vh,56px); display:flex; flex-direction:column; align-items:flex-end; gap:6px; max-width:min(50%,600px); text-align:right; transition:opacity .25s var(--ease-out)}
.is-era .title-card{opacity:0; transform:translateY(8px); visibility:hidden}
.is-era .corner{opacity:0; visibility:hidden}
/* on the way back the title waits until the river has mostly widened, so it is never written across the era's water */
.title-card,.corner{transition-delay:.38s} .is-era .title-card,.is-era .corner{transition-delay:0s}
.returning .title-card,.returning .corner,.returning #land,.returning .rkey{transition-duration:.42s; transition-delay:.55s} .returning .elabel{transition-delay:.3s}
@media (prefers-reduced-motion:reduce){ .title-card,.corner{transition-delay:0s} }
@media (max-width:680px){
  .title-card{max-width:calc(100% - 32px); bottom:92px} .title-card h1{font-size:min(2.9rem,12.4vw)}
  .corner{left:var(--gut); right:var(--gut); align-items:flex-start; text-align:left; max-width:none; bottom:20px}
}
.is-era .stage-inner{height:max(calc(446px + var(--rd,0px)), var(--eh,0px)); min-height:0; min-width:0; transition-duration:1s}
#cv{position:absolute; left:0; top:0; width:100%; display:block; cursor:pointer}
.stage-inner canvas.layer{position:absolute; left:0; top:0; width:100%; display:block; pointer-events:none}
.is-era #cv{cursor:default}
/* focus returned to an era's name on leaving is not drawn until the reader moves it, so no era looks chosen */
.elabel[data-quiet]:focus-visible{outline:none}

.labels{position:absolute; left:0; right:0; top:0; height:92px; pointer-events:none}
.elabel{position:absolute; top:6px; transform:translateX(-50%); text-align:center; pointer-events:auto; background:none; border:0; cursor:pointer; padding:4px 2px; transition:opacity .3s var(--ease-out), transform .3s var(--ease-out)}
.elabel .num{display:block; font-family:var(--label); color:var(--accent); font-size:1rem; letter-spacing:.06em; line-height:1.1}
.elabel .lname{display:block; min-height:var(--label-name-height,0px); overflow-wrap:anywhere; font-family:var(--display); font-size:15px; line-height:1.15; text-wrap:balance; transition:color .2s ease}
.elabel .yrs{display:block; overflow-wrap:anywhere; font-family:var(--label); font-size:1rem; color:var(--muted); letter-spacing:.02em; line-height:1.1}
.elabel.hot .lname{color:var(--water)}
@media (max-width:820px){ .elabel .lname, .elabel .yrs{display:none} .labels{height:40px} .elabel .num{font-size:clamp(14px,3.8vw,16px); letter-spacing:.03em; width:max-content; margin-left:50%; transform:translateX(-50%)} }
.is-era .elabel{opacity:0; pointer-events:none; transform:translateX(-50%) translateY(-10px)}
.elabel.lifted{opacity:0 !important}

/* The land along the river (whole river, wide screens): towns, hills, the sea, a rule of centuries and a key.
   Lettered as a chart: IM Fell French Canon for the title and era numerals, IM Fell Great Primer and its small capitals for everything else. */
:root{--canon:'IM Fell French Canon', 'IM Fell English', Georgia, serif; --primer:'IM Fell Great Primer', 'IM Fell English', Georgia, serif; --primer-sc:'IM Fell Great Primer SC', 'IM Fell English SC', Georgia, serif}
#land{position:absolute; left:0; top:0; pointer-events:none; font-variant-numeric:oldstyle-nums; transition:opacity .3s var(--ease-out); transition-delay:.38s}
.is-era #land,.is-era .rkey,.is-era .tslip{opacity:0; visibility:hidden; transition-delay:0s}
#land .ltown{pointer-events:auto; cursor:pointer; outline:none}
#land .lhit{fill:transparent}
#land .lcity{opacity:.42; transition:opacity .2s var(--ease-out)}
@media (hover:hover) and (pointer:fine){ #land .ltown:hover .lcity{opacity:.8} }
#land .ltown:focus-visible .lcity{opacity:.8}
#land .ltown:focus-visible .lhit{stroke:var(--water); stroke-width:2; stroke-dasharray:3 3}
#land .lroad{fill:none; stroke:#a8361d; stroke-width:2.6; stroke-dasharray:.1 8; stroke-linecap:round; opacity:0; transition:opacity .3s var(--ease-out)}
#land .lroad.on{opacity:.85}
#land .lname-t{font-family:var(--primer); fill:#2b2620; paint-order:stroke; stroke:rgba(236,232,220,.85); stroke-width:3.5px; stroke-linejoin:round}
#land .lsea{font-family:var(--primer); font-style:italic; fill:#2f4a8a; letter-spacing:.06em}
#land .lrn{font-family:var(--primer); font-size:12.5px; fill:#6b5f50}
#land .lrn.major{font-size:14px; fill:#a8361d}
#land .lrn.sc{font-family:var(--primer-sc); font-size:13px; letter-spacing:.05em; fill:#a8361d}
@media (prefers-reduced-motion:reduce){ #land{transition-delay:0s} }
/* a town's slip is a small schedula laid on the map: vellum with its grain, a ruled double frame like the key's, a rubricated initial,
   an ivy-leaf divider, the witness set right as a gloss, and the way in marked with the same leaf */
.tslip{position:absolute; z-index:3; width:304px; box-sizing:border-box; padding:16px 20px 14px; text-align:left;
  background:radial-gradient(ellipse 120% 90% at 30% 20%, rgba(255,250,236,.55), rgba(255,250,236,0) 60%), radial-gradient(circle at 88% 92%, rgba(150,110,50,.10), rgba(150,110,50,0) 40%), #f2ead6 var(--grain);
  border:1px solid #3a2f25; box-shadow:inset 0 0 0 4px #f2ead6, inset 0 0 0 4.6px rgba(58,47,37,.62), 2px 3px 0 rgba(58,47,37,.10), 0 8px 22px -12px rgba(60,40,20,.35);
  opacity:0; transform:translateY(4px); transition:opacity .18s var(--ease-out), transform .18s var(--ease-out); font-variant-numeric:oldstyle-nums}
.tslip.on{opacity:1; transform:none}
.tslip h3{font-family:var(--primer); font-weight:400; font-size:1.42rem; margin:0; line-height:1.1; text-align:center; letter-spacing:.005em}
.tslip h3 .ri{color:var(--accent); font-size:1.18em}
.tslip .meta{font-family:var(--primer-sc); color:var(--accent); font-size:.88rem; margin:3px 0 0; letter-spacing:.05em; text-align:center}
.tslip .drawn{font-family:var(--primer); font-style:italic; font-size:.8rem; color:var(--muted); margin:2px 0 0; text-align:center}
.tslip .orn{display:block; width:120px; height:12px; margin:7px auto 9px}
.tslip q{display:block; font-family:var(--primer); font-style:italic; font-size:1.04rem; line-height:1.42; color:#2b2620; quotes:"“" "”"; text-indent:-.4em; hyphens:manual}
.tslip .who{font-family:var(--primer-sc); font-size:.84rem; color:var(--muted); margin:7px 0 0; letter-spacing:.04em; text-align:right}
.tslip .who::before{content:"— "; font-family:var(--primer)}
.tslip .go{display:flex; align-items:center; gap:7px; margin:11px auto 0; font-family:var(--primer); font-style:italic; color:var(--accent); font-size:1rem; padding:0; border:0; background:none; cursor:pointer}
.tslip .go svg{flex:none; transition:transform .2s var(--ease-out)}
@media (hover:hover) and (pointer:fine){ .tslip .go:hover{text-decoration:underline; text-decoration-thickness:.5px; text-underline-offset:3px} .tslip .go:hover svg{transform:translateX(2px)} }
.rkey{position:absolute; width:338px; box-sizing:border-box; height:152px; padding:13px 12px 0 10px; background:rgba(241,235,221,.96); border:.9px solid #3a2f25; outline:.45px solid rgba(58,47,37,.7); outline-offset:-5px; pointer-events:none; transition:opacity .25s var(--ease-out); transition-delay:.38s}
.rkey-h{margin:0 0 6px; text-align:center; font-family:var(--primer-sc); font-size:15px; letter-spacing:.07em; color:var(--accent); line-height:1.2}
.rkey ul{list-style:none; margin:0; padding:0 0 0 2px}
.rkey li{display:flex; align-items:center; gap:12px; white-space:nowrap; font-family:var(--primer); font-size:14.5px; line-height:17.5px; color:var(--ink)}
.rkey li svg{flex:none}
.rkey[hidden],.tslip[hidden]{display:none}
.key-on .corner .legend{display:none}
/* the title, set as a chart's title: display cut for the words, Great Primer for the rest */
.title-card .eyebrow{font-family:var(--primer-sc); letter-spacing:.07em; font-size:15px}
.title-card h1{font-family:var(--canon); letter-spacing:-.005em}
/* the T is a real boxed initial, cut from a fifteenth-century Italian antiphonary leaf (The Met, 28.225.72, public domain); the rest of the title stands in two lines beside it */
.title-card h1{display:grid; grid-template-columns:auto auto; justify-content:start; column-gap:.1em; line-height:.98}
@media (min-width:681px){ .title-card h1{font-size:clamp(3rem,6.5vw,5.9rem)} }
.title-card h1 .ini{grid-row:1 / span 2; grid-column:1; width:1.64em; height:auto; align-self:start; margin:.14em .04em 0 0; border:1px solid #2b2620; box-shadow:0 0 0 3px var(--paper), 0 0 0 3.8px rgba(168,54,29,.8); pointer-events:auto}
.title-card h1 .l1{grid-column:2; grid-row:1} .title-card h1 .l2{grid-column:2; grid-row:2}
.title-card h1 .vh{position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap}
.title-card .lede{font-family:var(--primer); font-size:1.2rem; line-height:1.36; text-indent:-.42em; color:#4a4036}
.title-card .lede cite{font-family:var(--primer-sc); font-size:15px; letter-spacing:.05em; margin-left:.6em}
.title-card .colo{margin:.7em 0 0; font-family:var(--primer); font-style:italic; font-size:1rem; line-height:1.3}
.title-card .colo a{color:var(--accent); text-decoration:none; pointer-events:auto}
@media (hover:hover) and (pointer:fine){ .title-card .colo a:hover{text-decoration:underline; text-decoration-thickness:.5px; text-underline-offset:3px} }
.land-on .title-card{bottom:max(52px,clamp(24px,5vh,56px))}
.land-on .corner{bottom:max(52px,clamp(24px,5vh,56px))}
/* era heads: numeral, name and dates on shared baselines, no shrinking */
@media (min-width:821px){
  .elabel .num{font-family:var(--canon); font-size:22px; letter-spacing:.02em; line-height:1.05}
  .elabel .lname{font-family:var(--primer); font-size:15.5px; display:flex; flex-direction:column; justify-content:flex-end}
  .elabel .yrs{font-family:var(--primer-sc); font-size:13.5px; letter-spacing:.06em; font-variant-numeric:oldstyle-nums}
}
/* the reader's ribbon: a vermilion silk register let down from the head of the page beside the numeral of the era last read */
.ribbon{position:absolute; top:0; left:0; width:11px; height:24px; padding:0; border:0; background:none; cursor:pointer; transform-origin:50% 0;
  filter:drop-shadow(.6px 1.2px .6px rgba(43,38,32,.30)); animation:ribbon-in .7s cubic-bezier(.23,1,.32,1) backwards; transition:opacity .2s ease}
.ribbon i{position:absolute; inset:0; clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 6px),0 100%);
  background:
    linear-gradient(180deg, rgba(43,20,12,.38), rgba(43,20,12,0) 9px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, rgba(0,0,0,.035) 1px 2px),
    linear-gradient(90deg, #7E2416 0, var(--accent) 22%, #C2553C 40%, #B0402A 52%, var(--accent) 70%, #84281A 100%)}
.ribbon i::after{content:""; position:absolute; left:0; right:0; bottom:0; height:8px; background:linear-gradient(180deg, rgba(0,0,0,0), rgba(43,20,12,.18))}
.ribbon.under{height:18px; width:10px}
.ribbon[hidden]{display:none}
.ribbon::after{content:""; position:absolute; inset:-4px -10px}
@media (hover:hover){ .ribbon{transition:opacity .2s ease, transform .25s cubic-bezier(.23,1,.32,1)} .ribbon:hover{transform:scaleY(1.05)} }
.ribbon:focus-visible{outline:2px solid var(--water); outline-offset:3px}
.is-era .ribbon{opacity:0; pointer-events:none}
@keyframes ribbon-in{from{transform:translateY(-100%)}to{transform:none}}
.ribbon.under{animation-name:ribbon-under}
@keyframes ribbon-under{from{transform:scaleY(0)}to{transform:none}}
@media (prefers-reduced-motion: reduce){ .ribbon{animation:none} }

.era-head{position:absolute; left:var(--gut); right:var(--gut); top:calc(336px + var(--rd,0px)); visibility:hidden; display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px 24px}
.era-head > div{flex:1 1 auto; min-width:0}
.is-era .era-head{visibility:visible}
.era-head .meta{font-family:var(--label); color:var(--accent); letter-spacing:.04em; font-size:1.05rem; opacity:0; transition:opacity .25s var(--ease-out) .05s}
.era-head h2{font-family:var(--display); font-weight:400; font-size:clamp(2rem,4vw,3.1rem); line-height:1.05; margin:.1em 0 0; white-space:normal; overflow:hidden; text-overflow:ellipsis; opacity:0}
.era-head.landed h2{opacity:1}
.era-head.landed .meta, .era-head.landed nav{opacity:1}
.era-head nav{display:flex; gap:6px; flex-wrap:wrap; opacity:0; transition:opacity .25s var(--ease-out) .1s}
.era-head nav button{border:1px solid var(--rule); background:var(--card); border-radius:999px; padding:6px 14px; cursor:pointer; font-family:var(--label); font-size:1rem; letter-spacing:.03em; transition:border-color .2s ease, color .2s ease, transform .16s var(--ease-out)}
@media (hover:hover) and (pointer:fine){ .era-head nav button:hover{border-color:var(--water); color:var(--water)} }
.era-head nav button:active:not(:disabled){transform:scale(.97)}
.era-head nav button:disabled{opacity:.35; cursor:default; border-color:var(--rule); color:inherit}
@media (max-width:680px){ .is-era .stage-inner{height:var(--eh,560px)} .era-head{display:grid; grid-template-columns:1fr; top:calc(330px + var(--rd,0px))} .era-head h2{white-space:normal; font-size:1.8rem} }

.era-head h2:focus{outline:none}
/* the three river buttons keep to one row on phones: tighter buttons, and a shorter name for the middle one */
#back .md, #back .sm{display:none}
@media (max-width:680px){ .era-head nav{gap:4px} .era-head nav button{padding:6px 8px; letter-spacing:0; white-space:nowrap} #back .lg{display:none} #back .md{display:inline} }
@media (max-width:400px){ #back .md{display:none} #back .sm{display:inline} }
.flip{position:fixed; z-index:20; margin:0; pointer-events:none; font-family:var(--display); font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--ink); transform-origin:50% 50%; line-height:1.05}

.tip{position:absolute; z-index:5; pointer-events:none; background:#f2ead6 var(--grain); border:1px solid #3a2f25; box-shadow:inset 0 0 0 3px #f2ead6, inset 0 0 0 3.5px rgba(58,47,37,.55), 2px 3px 0 rgba(58,47,37,.08); padding:8px 12px 9px; font-family:var(--primer,var(--display)); font-style:italic; font-size:.95rem; line-height:1.35; color:#2b2620; max-width:250px; font-variant-numeric:oldstyle-nums}
.tip b{display:block; font-family:var(--primer-sc,var(--label)); font-style:normal; font-weight:400; color:var(--accent); letter-spacing:.05em; font-size:.95rem; margin-bottom:1px}

.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
#era.rich-mode{display:block}
/* Long names and enlarged text must wrap instead of being clipped at the viewport. */
#era{overflow-wrap:anywhere}
/* section tabs, set like a book's thumb index */
.tabs{position:sticky; top:0; z-index:30; display:flex; flex-wrap:wrap; gap:2px 4px; justify-content:center; padding:10px 8px 9px; margin:0 calc(50% - 50vw) 18px; background:var(--paper) var(--grain); border-bottom:1px solid var(--rule)}
.tabs button{min-width:0; overflow-wrap:anywhere; border:0; background:none; cursor:pointer; font-family:var(--label); font-size:1.02rem; letter-spacing:.03em; color:var(--muted); padding:4px 12px; border-radius:2px; position:relative; transition:color .2s ease, transform .16s var(--ease-out)}
@media (hover:hover) and (pointer:fine){ .tabs button:hover{color:var(--water)} }
.tabs button:active{transform:scale(.97)}
.tabs button[aria-current="true"]{color:var(--accent)}
/* one rubric underline slides to the current section, so the reader sees where they moved */
.tabs .ink{position:absolute; left:0; top:0; width:100px; height:1.5px; background:var(--accent); transform-origin:0 0; pointer-events:none; transition:transform .22s var(--ease-out)}
.tabs .ink.cold{transition:none}
/* leaves: each section is a sheet laid over the one before */
.leaves{position:relative}
.anchor{height:0}
.leaf{position:sticky; background:var(--paper) var(--grain); min-height:calc(100vh - var(--tabs-h,60px)); min-height:calc(100svh - var(--tabs-h,60px));
  /* full bleed: the sheet runs to the window's edges, so no card edges show */
  margin-inline:calc(50% - 50vw); padding:34px calc(50vw - 50% + clamp(16px,3vw,40px)) 30px;
  /* a pause: the reader scrolls this far with the leaf held still before the next one rises */
  margin-bottom:45vh;
  box-shadow:0 -18px 30px -22px rgba(70,48,16,.32)}
/* a covered leaf dims under a shade whose opacity alone changes while scrolling */
.leaf .shade{position:absolute; inset:0; background:#2B2620; opacity:0; pointer-events:none; z-index:3}
.leaf:first-of-type{box-shadow:none}
.leaf:last-child{margin-bottom:0}
.leaf .r{border-top:0; padding-block:6px}
.leaf .r + .r{border-top:1px solid var(--rule); padding-top:22px; margin-top:16px}
.fol{position:absolute; top:10px; right:16px; font-family:var(--display); font-style:italic; font-size:.95rem; color:var(--muted)}
.chn.sub{font-size:1rem}
@media (prefers-reduced-motion: reduce){ .leaf .shade{display:none} }
/* plates: a period picture tipped in beside the text of each leaf */
.r.wp{grid-template-columns:minmax(0,1fr) clamp(240px,24vw,330px) 200px; gap:0 44px}
.plate{margin:8px 0 0}

.leaf.seen .plate .im{animation:uncover .7s var(--ease-out) both}
.leaf.seen .plate figcaption{animation:caption .4s var(--ease-out) .25s both}
.plate .im{position:relative; padding:6px; border:1px solid rgba(168,50,31,.55)}
.plate .im::before{content:""; position:absolute; inset:2px; border:.5px solid rgba(168,50,31,.28); pointer-events:none}
/* a plate never makes its leaf taller than the window, so the whole leaf shows while it is held */
.plate .im{width:fit-content; max-width:100%; margin-inline:auto}
.plate img{display:block; width:auto; max-width:100%; height:auto; max-height:calc(100vh - var(--tabs-h,60px) - 250px); max-height:calc(100svh - var(--tabs-h,60px) - 250px); mix-blend-mode:multiply; filter:sepia(.16) saturate(.86) contrast(.97)}
/* the vellum shows through at the picture's edges, so it reads as tipped in */
.plate .im::after{content:""; position:absolute; inset:6px; pointer-events:none; background:radial-gradient(ellipse at 50% 46%, rgba(236,232,220,0) 58%, rgba(150,112,52,.2) 100%); mix-blend-mode:multiply}
.plate figcaption{margin-top:10px; font-size:.86rem; line-height:1.45; color:var(--gloss); font-style:italic}
.plate figcaption b{display:block; font-family:var(--label); font-weight:400; font-style:normal; font-size:1rem; letter-spacing:.03em; color:var(--accent); margin-bottom:2px}
.plate figcaption .pil{color:var(--accent); font-style:normal}
@media (max-width:1180px){ .r.wp{grid-template-columns:minmax(0,1fr) 200px} .r.wp .plate{grid-column:1; grid-row:2; width:100%; max-width:420px; margin:24px auto 8px} }
@media (max-width:860px){ .r.wp{grid-template-columns:1fr} .r.wp .plate{grid-row:auto} }
@media (prefers-reduced-motion: reduce){ .leaf.seen .plate .im{animation:caption .2s ease both} .leaf.seen .plate figcaption{animation:none} }
@media (max-width:600px){ .tabs{display:grid; grid-template-columns:repeat(3,auto); justify-content:center; gap:0 2px; padding:6px 0 5px; margin-inline:-16px} .tabs button{padding:3px 7px; letter-spacing:0} .leaf{padding:42px 16px 20px} .fol{top:8px} .tabs{margin-inline:-16px} }
.r{display:grid; grid-template-columns:minmax(0,1fr) 230px; gap:0 56px; padding-block:24px; border-top:1px solid var(--rule)}
.r:first-child{border-top:0; padding-top:0}
@media (max-width:860px){ .r{grid-template-columns:1fr} }
.rm{min-width:0}
.rm p{max-width:66ch; margin:0 0 1em; font-size:1.06rem}
.rm h3{font-family:var(--display); font-weight:400; font-size:clamp(1.6rem,2.6vw,2.1rem); line-height:1.15; margin:.1em 0 .45em; text-wrap:balance}
.chn{display:block; font-family:var(--label); color:var(--accent); font-size:1.05rem; letter-spacing:.03em}
.lomb{float:left; font-family:var(--display); font-size:3.4em; line-height:.82; margin:.06em .1em 0 0}
.lomb.blue{color:var(--water)} .lomb.red{color:var(--accent)}
.up{font-style:normal}
.goldnote{display:flex; gap:10px; align-items:baseline; font-style:italic; color:#7D5B12; font-size:.98rem !important}
.dia{display:inline-block; width:8px; height:8px; background:var(--gold); transform:rotate(45deg); margin-right:8px; flex:none; box-shadow:0 0 0 .8px rgba(43,38,32,.5)}
.panel{border:1px solid var(--rule); background:var(--card); border-radius:3px; padding:18px 20px 6px}
.lens{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px 36px}
.lens p{font-size:1rem !important}
.inf{color:var(--muted); font-style:italic}
.people .dates{color:var(--muted); font-size:.85rem; font-variant-numeric:lining-nums}
.rm .people{margin-top:12px}
.rm .events{margin-top:8px}
.read{margin:10px 0 0; padding-left:1.1em; display:flex; flex-direction:column; gap:6px}
.foot{font-size:.95rem; color:var(--muted); font-style:italic; margin:0}
.foot a{color:var(--water)}
.is-era #notes{display:none}
/* release (2026-10-16): the home page is the river alone, with nothing below it */
.page:has(> #era[hidden]){padding-block:0}

/* Era story */
#era{display:grid; grid-template-columns:minmax(0,1fr) 230px; gap:28px 56px; margin-top:-4px}
@media (max-width:860px){ #era{grid-template-columns:1fr; margin-top:-4px} }
#era .main{display:flex; flex-direction:column; gap:30px; min-width:0}
#era .cols2{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:28px 48px}
@media (max-width:700px){ #era .cols2{grid-template-columns:1fr} }
.gloss{font-size:.88rem; line-height:1.5; color:var(--gloss); font-style:italic; border-left:1px solid var(--rule); padding-left:16px; align-self:start; display:flex; flex-direction:column; gap:12px}
.gloss p{margin:0}
.gloss .pil{color:var(--accent); font-style:normal}
@media (max-width:860px){ .gloss{border-left:0; border-top:1px solid var(--rule); padding:12px 0 0} }
#era blockquote.scrip{padding:16px 0 14px; border-top:1px solid var(--gold); border-bottom:1px solid var(--gold); box-shadow:0 -4px 0 -3px var(--gold) inset}
@property --gx{syntax:'<percentage>'; inherits:false; initial-value:50%}
@keyframes burnish{from{--gx:28%} to{--gx:72%}}
/* the slow burnish runs only while the gilded letter is on screen; off screen it would restyle the page every frame for nothing */
.gilt.away{animation-play-state:paused}
.gilt{animation:burnish 9s ease-in-out infinite alternate; background:linear-gradient(var(--ang,115deg), #7D5B12 0%, #C49A3A 28%, #F3DC93 calc(var(--gx,50%) - 6%), #FFF7D6 var(--gx,50%), #E2BE62 calc(var(--gx,50%) + 8%), #A47A22 78%, #6E500F 100%); -webkit-background-clip:text; background-clip:text; color:transparent}
.ginit{float:left; width:74px; height:82px; margin:6px 14px 2px 0; border-radius:2px; background:var(--water); display:grid; place-items:center; position:relative; overflow:hidden; box-shadow:inset 0 0 0 2px var(--water), inset 0 0 0 3.5px var(--gold)}
.ginit::before{content:""; position:absolute; inset:7px; background-image:radial-gradient(circle, rgba(255,255,255,.55) .8px, transparent 1.3px); background-size:9px 9px; opacity:.5}
.gilt[data-hot]{animation:none}
.ginit .gilt{position:relative; display:block; font-family:var(--display); font-size:72px; line-height:1; transform:translate(var(--cx,0px),var(--cy,0px))}
#era .sum::after{content:""; display:block; clear:both}
#era .rv{opacity:0; transform:translateY(10px); transition:opacity .4s var(--ease-out), transform .45s var(--ease-out); transition-delay:calc(var(--i) * 60ms)}
#era.show .rv{opacity:1; transform:none}
#era blockquote{margin:0; font-family:var(--display); font-size:clamp(1.45rem,2.5vw,2rem); line-height:1.28; text-wrap:balance}
#era blockquote cite{display:block; margin-top:.6em; font-family:var(--label); font-style:normal; font-size:1rem; letter-spacing:.03em; color:var(--accent)}
#era .sum{font-size:1.1rem; max-width:64ch; margin:0}
.kicker{font-family:var(--label); font-size:1.05rem; letter-spacing:.03em; color:var(--accent); margin:0 0 10px; padding-bottom:6px; border-bottom:1px solid var(--rule)}
.two{max-width:60ch; margin:0; font-style:italic; color:var(--muted)}
.left, .right{display:flex; flex-direction:column; gap:28px; min-width:0}
.people{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px 18px}
.people li{display:grid; grid-template-columns:52px minmax(0,1fr); gap:12px; align-items:center; line-height:1.25}
.people .dates{white-space:nowrap}
/* people: each name gets a medallion, a lapis ring with a ring of rubric dots like the late antique clipeus, hung with a hedera leaf (the ivy-leaf mark of Roman inscriptions and early codices). The letter is in the era's hand and optically centred. */
.roundel{position:relative; display:block; width:52px; height:60px}
.roundel svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
.roundel .l{position:absolute; left:0; top:0; width:52px; height:52px; display:grid; place-items:center; font-family:var(--hand, var(--display)); font-size:25px; color:var(--water)}
.roundel .l i{display:block; font-style:normal; line-height:1; transform:translate(var(--cx,0px),var(--cy,0px))}
.people small{display:block; color:var(--muted); font-size:.82rem}
.events{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
.events li{display:grid; grid-template-columns:4.2em minmax(0,1fr); gap:12px; padding:7px 0; border-bottom:1px dotted var(--rule)}
.events .y{color:var(--accent); font-variant-numeric:lining-nums tabular-nums}

/* Notes */
#notes{margin-top:44px; display:flex; flex-direction:column; gap:40px}
#notes h2{font-family:var(--display); font-weight:400; font-size:clamp(1.6rem,2.6vw,2.1rem); margin:0 0 4px; line-height:1.1}
#notes .intro{color:var(--muted); margin:0 0 18px; max-width:66ch}
.dirs{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px}
@media (max-width:860px){ .dirs{grid-template-columns:1fr} }
.dir{text-align:left; border:1px solid var(--rule); border-radius:10px; background:var(--card); padding:18px 18px 16px; cursor:pointer; display:flex; flex-direction:column; gap:8px; transition:border-color .3s, transform .3s}
@media (hover:hover) and (pointer:fine){ .dir:hover{transform:translateY(-2px)} }
.dir[aria-pressed="true"]{border-color:var(--ink)}
.dir .chips{display:flex; gap:4px}
.dir .chips i{width:26px; height:14px; border-radius:3px; display:block}
.dir h3{margin:0; font-size:1.5rem; font-weight:400; line-height:1.1}
.dir p{margin:0; font-size:.94rem}
.dir .risk{color:var(--muted); font-style:italic; font-size:.88rem}
.dir .state{font-family:var(--label); letter-spacing:.08em; font-size:.74rem; color:var(--accent)}
.cols{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:28px 56px}
@media (max-width:860px){ .cols{grid-template-columns:1fr} }
.chor{list-style:none; margin:0; padding:0}
.chor li{display:grid; grid-template-columns:6.5em minmax(0,1fr); gap:12px; padding:8px 0; border-bottom:1px dotted var(--rule)}
.chor .t{font-family:var(--label); color:var(--accent); font-variant-numeric:tabular-nums; letter-spacing:.03em}
.plain{margin:0; padding-left:1.1em; display:flex; flex-direction:column; gap:8px}
.plain li{padding-left:.2em}

/* The catena page. As in the catenae and glossed books of the period, each excerpt is headed by its author's name in red (the lemma),
   the reader's notes stand in the margin beside the passage they belong to, and the opening lines of a chapter are rubricated.
   Ink is quoted; the red rubrics and the green notes are the editor's. */
.cat{display:grid; grid-template-columns:minmax(0,1fr) 230px; column-gap:56px; row-gap:0; align-items:start}
.cat.wp{grid-template-columns:minmax(0,1fr) clamp(240px,24vw,330px) 200px; column-gap:44px}
.cat > .b{grid-column:1; min-width:0; max-width:68ch; margin:0 0 1.25em}
.cat > .bg{grid-column:-2 / -1; min-width:0; margin:0 0 1.25em; font-size:.88rem; line-height:1.5; color:var(--gloss); font-style:italic; padding-top:.15em}
.bg p{margin:0 0 .5em}
.bg .pil, .b .pil{color:var(--accent); font-style:normal}
.bg a, .cat a{color:var(--water); text-underline-offset:.18em; text-decoration-thickness:.06em}
.cat h3{font-family:var(--display); font-weight:400; font-size:clamp(1.6rem,2.6vw,2.1rem); line-height:1.15; margin:.1em 0 .2em; text-wrap:balance}
.chhead{margin-bottom:calc(.9em - 8px) !important}
.b-sch{font-size:1.04rem; line-height:1.62; color:#3B342B}
.b-w p, .b-ref p{margin:0; font-size:1.08rem; line-height:1.64}
.lem{display:block; font-family:var(--label); color:var(--accent); font-size:1rem; letter-spacing:.04em; line-height:1.2; margin-bottom:.25em}
.b-w.inc p::first-line, .b-sch.inc::first-line{color:var(--accent)}
.b-ref{padding:14px 18px 16px; background:var(--card); border:1px solid var(--rule); border-radius:3px}
.b-ref .lem{color:var(--water)}
.gchart{margin:6px 0 0}
.gchart .gc-key{display:flex; gap:20px; font-family:var(--label); font-size:1rem; color:var(--muted); margin-bottom:10px}
.gchart .gc-key span::before{content:""; display:inline-block; width:14px; height:10px; margin-right:7px; vertical-align:baseline}
.gchart .gc-key .k1::before, .gchart .y1{background:rgba(107,99,85,.45)} .gchart .gc-key .k2::before, .gchart .y2{background:var(--water)}
.gchart .gc-row{display:grid; grid-template-columns:minmax(0,11rem) minmax(0,1fr); gap:2px 14px; align-items:center; margin:0 0 12px}
.gchart .gc-n{grid-row:span 2; font-family:var(--label); font-size:1rem; line-height:1.2}
.gchart .gc-b{display:flex; align-items:center; gap:8px; min-width:0}
.gchart .gc-b i{display:block; height:12px; min-width:2px}
.gchart .gc-b em{font-style:normal; font-size:.95rem; font-variant-numeric:lining-nums tabular-nums; white-space:nowrap}
.gchart figcaption{margin-top:6px; font-family:var(--label); font-size:1rem; color:var(--accent); letter-spacing:.03em}
@media (max-width:600px){ .gchart .gc-row{grid-template-columns:minmax(0,1fr)} .gchart .gc-n{grid-row:auto} }
.b-ed{font-family:var(--display); font-style:italic; color:var(--gloss); font-size:1.1rem; line-height:1.45}
.b-head{font-family:var(--display); font-weight:400; font-size:1.5rem; line-height:1.2; margin:.9em 0 .5em !important; display:flex; gap:.45em; align-items:center; text-wrap:balance}
.hed{width:22px; height:18px; color:var(--accent); flex:none}
.explicit{text-align:center; color:var(--accent); padding-top:.4em}
.explicit .hed{width:34px; height:28px}
.pcol{grid-column:2; align-self:stretch; min-width:0}
.pcol .plate{position:sticky; top:calc(var(--tabs-h,60px) + 20px)}
.sum::after{content:""; display:block; clear:both}
.cat > p.b.sum{margin:0 0 1.25em !important}
.cat > .b.wide{max-width:none}
/* the capitula */
.capit{list-style:none; padding:0; margin:18px 0 0; columns:2 280px; column-gap:44px}
.capit li{break-inside:avoid}
.capit button{appearance:none; border:0; background:none; color:inherit; text-align:left; cursor:pointer; display:grid; grid-template-columns:2.9em minmax(0,1fr) auto; gap:12px; align-items:baseline; width:100%; padding:7px 0; font-family:var(--display); font-size:1.2rem; line-height:1.25; transition:color .2s ease, transform .16s var(--ease-out)}
.capit button:active{transform:scale(.97)}
.capit button:focus-visible{outline:2px solid var(--water); outline-offset:3px; border-radius:2px}
@media (hover:hover) and (pointer:fine){ .capit button:hover .t{color:var(--accent)} }
.capit .num{text-align:right; font-variant-numeric:lining-nums}
.capit .num.red{color:var(--accent)} .capit .num.blue{color:var(--water)}
.capit .t{transition:color .2s ease}
.capit .y{font-family:var(--label); font-size:1rem; color:var(--muted); white-space:nowrap}
/* people with a witness's line */
.people.pq{grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:24px 32px; margin-top:16px}
.people.pq li{align-items:start}
.people .nm{font-family:var(--display); font-size:1.12rem}
.people q{display:block; margin-top:6px; font-size:.95rem; line-height:1.5}
.people q::before{content:"“"} .people q::after{content:"”"}
.people cite{display:block; margin-top:3px; font-size:.84rem; color:var(--gloss)}
/* the map */
.map{margin:0}
.map svg{display:block; width:100%; height:auto; padding:5px; border:1px solid rgba(168,50,31,.5); background:var(--paper)}
.map text{paint-order:stroke; stroke:#ECE8DC; stroke-width:5px; stroke-linejoin:round}
.map .mk-s{font-family:var(--label); font-size:27px; fill:#2F4E9E}
.map .mk-c{font-family:var(--label); font-size:25px; fill:#A8321F}
.map .mk-p{font-family:var(--display); font-style:italic; font-size:23px; fill:#2B2620}
.map figcaption{margin-top:8px; font-family:var(--label); font-size:1rem; color:var(--accent); letter-spacing:.03em}
@media (max-width:1180px){
  .cat.wp{grid-template-columns:minmax(0,1fr) 200px}
  .pcol{grid-column:1; grid-row:2 !important}
  .pcol.p2{grid-row:auto !important}
  .pcol .plate{position:static; width:100%; max-width:440px; margin:6px auto 26px}
}
@media (max-width:860px){
  .cat, .cat.wp{grid-template-columns:minmax(0,1fr)}
  .cat > .bg{grid-column:1; margin-top:-.75em; font-size:.84rem}
  .cat > .bg:empty{display:none}
  .pcol{grid-row:auto !important}
  .capit{columns:1}
}
@media (max-width:600px){ .map .mk-p{display:none} .map .mk-s{font-size:34px} .map .mk-c{font-size:32px} }

/* a chapter's Scripture: gilded, as Scripture alone is */
.cat > .b-scrip{margin:.2em 0 1.4em; padding:12px 0 11px; border-top:1px solid var(--gold); border-bottom:1px solid var(--gold); font-family:var(--display); font-size:1.32rem; line-height:1.32; text-wrap:balance}
/* a long reading from Scripture keeps its gilt rules but is set at reading size, as the witnesses are */
#era .cat > .b-scrip.long{font-family:var(--display); font-size:1.24rem; line-height:1.5; text-wrap:pretty; padding:14px 0 12px; margin:.3em 0 1.5em}
/* a gilt rule sits equidistant from the ink on either side of it */
#era .cat > .b-scrip{margin:0 0 14px}
#era .cat > .b-scrip.long{margin:-8px 0 13px}
#era .cat > .b-head + .bg + .b-scrip{margin-top:0}
#era .cat > .b-scrip + .bg + .b-scrip{margin-top:10px}
.b-scrip cite{display:block; margin-top:.45em; font-family:var(--label); font-style:normal; font-size:1rem; letter-spacing:.03em; color:var(--accent)}

@media (prefers-reduced-motion: reduce){
  .tabs .ink{transition:none !important}
  .stage-inner, .elabel, .title-card{transition:none !important}
  #era .rv{transform:none !important; transition:opacity .2s ease !important; transition-delay:0s !important}
  .gilt{animation:none !important}
}

/* a leaf three sheets down the pile is out of sight: it stays in the page and in the reading order, but is not painted, which keeps fast scrolling smooth */
.leaf.deep{opacity:0}
/* the plate's frame is sized from the picture's shape before it loads */
.plate .im{box-sizing:border-box; width:min(100%, calc((100vh - var(--tabs-h,60px) - 250px) * var(--ar,1) + 14px)); width:min(100%, calc((100svh - var(--tabs-h,60px) - 250px) * var(--ar,1) + 14px))}
.plate img{width:100%; height:auto; max-height:none; aspect-ratio:var(--ar,auto); transition:opacity .25s var(--ease-out)}
.plate .im.wait{background:rgba(168,50,31,.035)}
.plate .im.wait img{opacity:0}

/* ---- Hard words: a faint dotted underline in the text; the scribe's tie mark (signe de renvoi) and headword in the margin, the quoted definition unfolding as source notes do ---- */
.gw{cursor:pointer; border-radius:2px; text-decoration:underline dotted color-mix(in srgb, var(--gloss) 55%, transparent); text-decoration-thickness:1.5px; text-underline-offset:.22em; text-decoration-skip-ink:auto; transition:background-color .16s var(--ease-out)}
.gw.lit{background:color-mix(in srgb, var(--gloss) 16%, transparent)}
.gw:focus-visible{outline:2px solid var(--water); outline-offset:1px}
.bg p.gdef .renvoi{color:var(--gloss); font-style:normal; font-size:1.25rem; line-height:0; vertical-align:-.08em; margin-right:.12em}
.bg p.gdef .hw{font-family:'IM Fell English SC', 'IM Fell English', serif; font-style:normal; font-size:1rem; letter-spacing:.02em}
.bg p.gdef.lit .hw{text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px}
@media (min-width:861px) and (hover:hover) and (pointer:fine){ .bg p.gdef.lit .more{opacity:1; transform:none; pointer-events:auto} }

/* ---- Quieter leaves: the apparatus folds, the writings never do ---- */
/* the margin: author and place stand; translator, year and link unfold on pointing or tapping */
.bg .sig{display:block; appearance:none; border:0; background:none; padding:0; margin:0; font:inherit; color:inherit; text-align:left; cursor:pointer; line-height:inherit}
.bg .sig:focus-visible{outline:2px solid var(--water); outline-offset:2px}
.bg p.has-more{position:relative}
.bg .more{display:block}
.bg .more > span{display:block}
@media (min-width:861px){
  .bg .more{position:absolute; z-index:6; left:-10px; right:-10px; top:100%; padding:6px 10px 8px; background:var(--paper); box-shadow:0 10px 24px -14px rgba(70,48,16,.45); border-left:1px solid rgba(168,50,31,.45);
    opacity:0; transform:translateY(-4px); pointer-events:none; transition:opacity .16s var(--ease-out), transform .16s var(--ease-out)}
  .bg p.open .more{opacity:1; transform:none; pointer-events:auto}
  @media (hover:hover) and (pointer:fine){ .bg p.has-more:hover .more{opacity:1; transform:none; pointer-events:auto} }
}
@media (max-width:860px){
  .bg .more{display:grid; grid-template-rows:0fr; transition:grid-template-rows .22s var(--ease-out)}
  .bg .more > span{overflow:hidden; min-height:0}
  .bg p.open .more{grid-template-rows:1fr}
}
/* people: a roll of medallions; each witness opens as a slip */
.roll{list-style:none; padding:0; margin:18px 0 0; display:grid; grid-template-columns:repeat(auto-fill,minmax(176px,1fr)); gap:4px 16px}
.roll > li{position:relative; min-width:0}
.roll .who{appearance:none; border:0; background:none; color:inherit; font:inherit; cursor:pointer; width:100%; text-align:left; display:grid; grid-template-columns:52px minmax(0,1fr); gap:12px; align-items:center; padding:6px 4px; border-radius:3px; transition:transform .16s var(--ease-out)}
.roll .who:active{transform:scale(.97)}
.roll .who:focus-visible{outline:2px solid var(--water); outline-offset:2px}
.roll .nm{display:block; font-family:var(--display); font-size:1.1rem; line-height:1.15; transition:color .2s ease}
.roll .dt{display:block; font-family:var(--label); font-size:.9rem; color:var(--muted); margin-top:2px; font-variant-numeric:lining-nums}

function pickChannel(yr){
  let tot=0; const o=[];
  for(const id of ORDER){ const r=chAt(CH[id],yr); if(r&&r[1]>.004){ const wt=r[1]*(CH[id].fade||1); o.push([id,wt]); tot+=wt; } }
  if(!o.length) return null; let x=Math.random()*tot; for(const [id,wt] of o){ if((x-=wt)<=0) return id; } return o[o.length-1][0];
}
function spawn(p){
  const u=view.u0+Math.random()*(view.u1-view.u0), yr=u2y(u), id=pickChannel(yr);
  p.ok=!!id; if(!id) return; p.ch=id; p.u=u; p.lat=(Math.random()*2-1)*.88; p.ph=Math.random()*6.283; p.max=2.2+Math.random()*3.6; p.life=reduce?p.max*(.3+.4*Math.random()):0; /* under reduced motion the streaks hold still, so each is placed mid-life and fully visible */ p.gold=Math.random()<(showGT?(inRecovery(id,u2y(u))?.42:.22):.04);
}
for(let i=0;i<NP;i++){ const p={}; spawn(p); p.life=Math.random()*p.max; P.push(p); }
let nP=NP; // streaks drawn each frame; a slow machine is given fewer (see paint)

/* ---------- Drawing ---------- */
function sample(id){
  const ch=CH[id], k=ch.k;
  const ua=Math.max(view.u0,y2u(k[0][0])), ub=Math.min(view.u1,y2u(k[k.length-1][0]));
  if(ub<=ua) return null;
  const n=Math.max(16,Math.round((ub-ua)/(view.u1-view.u0)*190)); const pts=[];
  for(let i=0;i<=n;i++){ const u=ua+(ub-ua)*i/n, yr=u2y(u), r=chAt(ch,yr); if(r) pts.push([X(u), r[0]+mea(u), r[1]]); }
  return pts.length>1?pts:null;
}
function poly(pts,m,add){ if(!add) ctx.beginPath(); for(let i=0;i<pts.length;i++){ const p=pts[i], y=Yp(p[1]-p[2]*m/2); i?ctx.lineTo(p[0],y):ctx.moveTo(p[0],y);} for(let i=pts.length-1;i>=0;i--){ const p=pts[i]; ctx.lineTo(p[0],Yp(p[1]+p[2]*m/2)); } ctx.closePath(); }
function edge(pts,lat,px=0){ ctx.beginPath(); for(let i=0;i<pts.length;i++){ const p=pts[i], y=Yp(p[1]+p[2]*lat/2)+px; i?ctx.lineTo(p[0],y):ctx.moveTo(p[0],y);} }

function drawChannel(id,S){
  const pts=sample(id); if(!pts) return; const f=CH[id].fade||1; const pxPerUnit=(view.bottom-view.top)/(view.y1-view.y0);
  if(S.mode==='lapis'){
    // shallows, body, and a deep channel that wanders from bank to bank
    ctx.fillStyle=`rgba(${S.wash},${.16*f})`; poly(pts,1.08); ctx.fill();
    ctx.fillStyle=`rgba(${S.wash},${.30*f})`; poly(pts,.9); ctx.fill();
    const ph=CH[id].ph||0, deep=pts.map(p=>{ const o=.22*Math.sin(p[0]*.012+ph); return [p[0], p[1]+p[2]*o, p[2]*.42]; });
    ctx.fillStyle=`rgba(${S.deep},${.30*f})`; poly(deep,1); ctx.fill();
    ctx.lineWidth=.8; ctx.strokeStyle=`rgba(${S.ink},${.28*f})`; edge(pts,-.9); ctx.stroke(); edge(pts,.9); ctx.stroke();
  } else if(S.mode==='lines'){
    ctx.fillStyle=`rgba(${S.wash},${.95*f})`; poly(pts,1); ctx.fill();
    ctx.lineWidth=1.2; ctx.strokeStyle=`rgba(${S.ink},${.85*f})`; edge(pts,-1); ctx.stroke(); edge(pts,1); ctx.stroke();
    ctx.lineWidth=.6; ctx.strokeStyle=`rgba(${S.ink},${.32*f})`; edge(pts,-1,-3.2); ctx.stroke(); edge(pts,1,3.2); ctx.stroke();
    const maxW=Math.max(...pts.map(p=>p[2]))*pxPerUnit;
    if(maxW>12){ ctx.lineWidth=.55; ctx.strokeStyle=`rgba(${S.deep},${.3*f})`; ctx.setLineDash([7,4]);
      for(const l of [-.75,-.5,-.25,.25,.5,.75]){ edge(pts,l); ctx.stroke(); } ctx.setLineDash([]); }
  } else {
    for(const [m,a] of [[1.32,.08],[1.06,.13],[.8,.15],[.52,.17],[.26,.15]]){ ctx.fillStyle=`rgba(${S.wash},${a*f})`; poly(pts,m); ctx.fill(); }
    ctx.lineWidth=1.6; ctx.strokeStyle=`rgba(${S.deep},${.2*f})`; edge(pts,-1.06); ctx.stroke(); edge(pts,1.06); ctx.stroke();
  }
}

/* lapis water: each layer is one path across every channel at the same strength, so where channels meet the wash is laid once, not twice */
/* the water itself changes only when the view moves, so it is painted once onto a sheet and laid down each frame beneath the moving streaks */
function drawLapis(S){
  const key=[view.u0,view.u1,view.y0,view.y1,view.top,view.bottom,Wd,Hd,cvH,dpr,skin,eraFade.toFixed(3)].join();
  if(key!==wKey){ wKey=key;
    const real=ctx; ctx=wSheet.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,Wd,cvH);
    try{ paintVellum(S); paintLapis(S); } finally { ctx=real; } }
}
function paintLapis(S){
  const groups=new Map();
  for(const id of ORDER){ const pts=sample(id); if(!pts) continue; const f=CH[id].fade||1; if(!groups.has(f)) groups.set(f,[]); groups.get(f).push([id,pts]); }
  for(const [f,list] of groups){
    ctx.fillStyle=`rgba(${S.wash},${.16*f})`; ctx.beginPath(); for(const [,p] of list) poly(p,1.08,1); ctx.fill('nonzero');
    ctx.fillStyle=`rgba(${S.wash},${.30*f})`; ctx.beginPath(); for(const [,p] of list) poly(p,.9,1); ctx.fill('nonzero');
    ctx.fillStyle=`rgba(${S.deep},${.30*f})`; ctx.beginPath();
    // a branch's deep channel opens only once it has left the parent water, so no dark thread runs through the trunk
    for(const [id,p] of list){ if(CH[id].rank===2) continue; const ph=CH[id].ph||0, br=CH[id].k[0][2]===0;
      poly(p.map(q=>{ const o=.22*Math.sin(q[0]*.012+ph); let w=q[2]*.42;
        if(br){ const uu=xToU(q[0]), yr=u2y(uu); for(const id2 of ORDER){ if(id2===id||(CH[id2].k[0][2]===0&&id2!==CH[id].from)) continue; const r=chAt(CH[id2],yr); if(!r) continue;
          const d=Math.abs(q[1]-(r[0]+mea(uu)))/(r[1]/2+q[2]/2); w*=sm(Math.min(1,Math.max(0,(d-.55)/.45))); } }
        return [q[0], q[1]+q[2]*o, w]; }),1,1); }
    ctx.fill('nonzero');
  }
  // a branch's banks are drawn in gradually, so a new church emerges from the water rather than being cut into it.
  // Where two churches still share the water, neither bank is drawn across it: all banks go on a scratch sheet, every church's water is wiped from it
  // in one fill, and the rest is laid on the river. (A stacked clip per neighbour per church made a zoom several times slower.) Each church's water is
  // wiped a little inside its own banks, by at least the width of the line, so it never takes its own bank with it.
  const real=ctx; ctx=bankSheet(); ctx.clearRect(0,0,Wd,cvH); ctx.lineWidth=.8;
  const ppu=(view.bottom-view.top)/(view.y1-view.y0);
  for(const [f,list] of groups){
    for(const [id,p] of list){ const k=CH[id].k, ba=(CH[id].braid?.17:.28)*f; let st=`rgba(${S.ink},${ba})`;
      if(k[0][2]===0){ const xa=X(y2u(k[0][0])), xb=X(y2u(k[1][0])); if(xb>xa+1){ st=ctx.createLinearGradient(xa,0,xb,0); st.addColorStop(0,`rgba(${S.ink},0)`); st.addColorStop(.35,`rgba(${S.ink},0)`); st.addColorStop(1,`rgba(${S.ink},${ba})`); } }
      ctx.strokeStyle=st; edge(p,-.9); ctx.stroke(); edge(p,.9); ctx.stroke(); } }
  ctx.globalCompositeOperation='destination-out'; ctx.beginPath();
  for(const [f,list] of groups) for(const [,p] of list) poly(p.map(q=>{ const w=q[2]*ppu; return [q[0],q[1],w>0?q[2]*Math.max(0,Math.min(.84,.9-1.1/w))/.84:0]; }),.84,1);
  ctx.fill('nonzero'); ctx.globalCompositeOperation='source-over';
  const sc=ctx.canvas; ctx=real; ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(sc,0,0); ctx.restore();
}
const bankC=document.createElement('canvas');
function bankSheet(){ if(bankC.width!==wSheet.width||bankC.height!==wSheet.height){ bankC.width=wSheet.width; bankC.height=wSheet.height; } const c=bankC.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); return c; }
let hover=-1, quietFocus=false, lastHover=-1, hv=0, mouse=null, T=0, eraFade=0, mHover=null;
function drawAxis(S){

  const step=[1,2,5,10,20,25,50,100].find(s=>span/s<=11)||100;

function drawSpring(S){

    ctx.strokeStyle=`rgba(${S.mode==='lines'?S.ink:S.deep},${(1-ph)*.45})`; ctx.lineWidth=1; ctx.beginPath(); ctx.ellipse(x,y,r,r*.7,0,0,6.283); ctx.stroke(); }

/* Gospel layer: gold carried in every channel; recoveries brighten across every church they touched; creeds and confessions gilded on the water */
const CONFESSIONS=[[325,'Nicene Creed','one'],[451,'Definition of Chalcedon','one'],[1530,'Augsburg Confession','lutheran'],[1561,'Belgic Confession','reformed'],[1563,'Heidelberg Catechism','reformed'],[1571,'Thirty-Nine Articles','anglican'],[1577,'Formula of Concord','lutheran'],[1619,'Canons of Dort','reformed'],[1644,'First London Confession','partbaptist'],[1646,'Westminster Confession','reformed'],[1658,'Savoy Declaration','congregational'],[1689,'Second London Confession','partbaptist'],[1784,'Methodist Articles of Religion','methodist'],[1974,'Lausanne Covenant','anglican']];

/* the Reformed family's strands are tied where one confession was adapted for another polity: Savoy (1658) from Westminster, the Second London (1689) from both */

function drawTies(S){
  for(const [yr,a,b] of TIES){ const u=y2u(yr), x=X(u); if(x<-10||x>Wd+10) continue; const ra=chAt(CH[a],yr), rb=chAt(CH[b],yr); if(!ra||!rb) continue;

}
function drawDepartures(S){
  const a=eraFade; if(a<.02) return;
  ctx.save(); ctx.globalAlpha=a; ctx.setLineDash([1.2,3.2]); ctx.lineCap='round'; ctx.lineWidth=1.3;
  for(const id in DEP){ const d=DEP[id], k=d.k, ua=Math.max(view.u0,y2u(k[0][0])), ub=Math.min(view.u1,y2u(k[k.length-1][0])); if(ub<=ua) continue;
    const xa=X(y2u(k[0][0])), xb=X(y2u(k[k.length-1][0])); const g=ctx.createLinearGradient(xa,0,xb,0);
    g.addColorStop(0,`rgba(${S.ink},.15)`); g.addColorStop(.3,`rgba(${S.ink},.6)`); g.addColorStop(1,`rgba(${S.ink},0)`); ctx.strokeStyle=g;
    ctx.beginPath(); const n=40; for(let i=0;i<=n;i++){ const u=ua+(ub-ua)*i/n, yr=u2y(u), r=chAt({k},yr)||[k[0][1]]; const x=X(u), y=Yp(r[0]+mea(u)); i?ctx.lineTo(x,y):ctx.moveTo(x,y); } ctx.stroke();
    if(Wd<680) continue; /* on a phone the dotted line stays and its label yields to the events */
    ctx.save(); ctx.setLineDash([]); ctx.font=`italic 12px Spectral, Georgia, serif`; ctx.textAlign='left'; ctx.lineWidth=3.5; ctx.strokeStyle=`rgba(${S.paper},.88)`; ctx.fillStyle=`rgba(${S.ink},.62)`;
    // the label rides the dry line wherever along it no channel name already stands
    const t=d.name+' · left the Nicene faith', w=ctx.measureText(t).width, k0=k[0][0], k1=k[k.length-1][0];
    for(const ly of [k[1][0],k0+(k1-k0)*.25,k0+(k1-k0)*.55,k0+(k1-k0)*.1]){ const lu=y2u(ly); if(lu<view.u0||lu>view.u1) continue; const r=chAt({k},ly); if(!r) continue;
      const x=Math.min(Wd-w-8,X(lu)+6), y=Yp(r[0]+mea(lu))-5;
      if(LBL.some(q=>Math.abs(q[1]-y)<14&&x<q[0]+q[2]/2+8&&x+w>q[0]-q[2]/2-8)) continue;
      ctx.strokeText(t,x,y); ctx.fillText(t,x,y); break; }

function drawConfessions(S){
  for(const c of CONFESSIONS){ const [x,y]=markXY(c[0],c[2]); if(x<-10||x>Wd+10) continue;
    ctx.save(); ctx.translate(x,y); ctx.rotate(Math.PI/4);
    ctx.fillStyle=`rgba(${S.gold},.95)`; ctx.strokeStyle=`rgba(${S.ink},.6)`; ctx.lineWidth=.8; ctx.fillRect(-3.6,-3.6,7.2,7.2); ctx.strokeRect(-3.6,-3.6,7.2,7.2);
    ctx.restore(); }
}
function markXY(yr,id){ const u=y2u(yr); let r=chAt(CH[id],yr); if(!r) r=chAt(CH[pickChannel(yr)||'one'],yr)||[0,.1]; return [X(u),Yp(r[0]+mea(u)),r[1]*(view.bottom-view.top)/(view.y1-view.y0)]; }
function drawMarks(S){
  if(mode==='home' || eraFade<1){
    const a=1-eraFade; mHover=null;
    const KEY={30:'Pentecost',325:'Nicaea',1054:'East and West divide',1517:'Ninety-five Theses'};
    // on a phone only the four landmark events keep their dots on the whole river: the rest are pointed at with a mouse, and there they would sit under the names
    for(const m of MARKS){ if(Wd<520&&mode==='home'&&!KEY[m[0]]) continue; const [x,y,wpx]=markXY(m[0],m[2]); if(x<-10||x>Wd+10) continue;
      const hot=mouse&&Math.hypot(mouse[0]-x,mouse[1]-y)<10; if(hot) mHover={m,x,y};
      ctx.globalAlpha=a; ctx.fillStyle=hot?S.accent:`rgba(${S.ink},.85)`; ctx.beginPath(); ctx.arc(x,y,hot?4.5:2.4,0,6.283); ctx.fill();

        ctx.strokeText(t,cx,ly); ctx.fillStyle=S.accent; ctx.fillText(t,cx,ly);
        ctx.strokeStyle=`rgba(${S.ink},.3)`; ctx.lineWidth=.8; ctx.beginPath(); ctx.moveTo(x,up?y-3:y+3); ctx.lineTo(x,up?ly+5:ly-12); ctx.stroke(); } }

      for(const [a,b,label,chs] of RECOVERIES){ if(mHover||!mouse) break; const yr=u2y(view.u0+mouse[0]/Wd*(view.u1-view.u0)); if(yr<a||yr>b) continue;
        for(const id of chs){ const r=chAt(CH[id],yr); if(!r) continue; const u=y2u(yr), cy=Yp(r[0]+mea(u)), h=r[1]*(view.bottom-view.top)/(view.y1-view.y0)/2;

    const placed=[], fY=`16px "IM Fell English SC", Georgia, serif`, fN=`italic 13.5px Spectral, Georgia, serif`;

      ctx.font=fY; const wy=ctx.measureText(yr).width; ctx.font=fN; const wn=ctx.measureText(ev[1]).width;

const LABEL_AT={one:200,coe:1250,oriental:880,east:1380,west:1350,lutheran:1700,reformed:1880,congregational:1745,partbaptist:1960,anglican:1820,moravian:1790,methodist:1850,pentecostal:1990,anabaptist:1700};
let LBL=[]; // channel names placed this frame, so departure labels can keep clear of them

let HL=null, HLk='';
function homeLayout(){

  const cr=cv.getBoundingClientRect(), html=[...document.querySelectorAll('.title-card > *, .corner .legend')].map(e=>e.getBoundingClientRect()).filter(r=>r.width).map(r=>[r.left-cr.left-4,r.top-cr.top-4,r.right-cr.left+4,r.bottom-cr.top+4]);

/* An era told in its own writings. E carries what differs between eras: the data, the plates, the annals and the map. */
function renderRich(E){
  const N=E, CH=E.chapters()||[], X=E.extra()||{}, PLATES=E.plates;
  let k=0; const r=()=>`style="--i:${k++}"`;
  const up=w=>`<span class="up">${w}</span>`;
  // the margin note for a quoted passage: who, where, whose translation, and a way to read the whole
  // the margin names the witness and the place; the translation, year and link unfold when pointed at or tapped
  let lastSrc='', lastRef='';
  const cite=(q,idem)=>{ const full=`${q.author}, ${up(q.work)}${q.ref?' '+q.ref:''}.`; const head=idem?`<span class="idem">Idem${q.ref&&q.ref!==lastRef?', '+q.ref:''}.</span>`:full;
    const rest=`${idem?full+' ':''}${q.tr?`Tr. ${q.tr}${q.year?', '+q.year:''}. `:(q.year&&!/Schaff/.test(q.author)?`${q.year}. `:'')}${q.url?`<a href="${q.url}" target="_blank" rel="noopener">Read the whole</a>`:''}`;
    return rest?`<button type="button" class="sig" aria-expanded="false">${head}</button><span class="more"><span hidden="until-found">${rest}</span></span>`:head; };
  const note=h=>`<p><span class="pil">¶</span> ${h}</p>`;
  // hard words: the first use of a word in a chapter carries a tie mark; its definition, quoted from a period source, waits in the margin under the source note
  const G=window.GLOSS||{t:{},m:{}}, GSLUG=['apostolic','ante-nicene','nicene','early-medieval','late-medieval','late-medieval-vi','reformation','orthodoxy','nineteenth','global'][RENDER_I];
  let gn=0;
  const gloss=(html,sect,id)=>{ const marks=G.m[GSLUG+'|'+sect+'|'+id], i=html.lastIndexOf('<aside class="bg">'); if(!marks||i<0) return html;
    let main=html.slice(0,i), notes='';
    marks.forEach(([name,forms])=>{ const d=G.t[name]; if(!d) return;
      const re=new RegExp('(^|[^\\p{L}])('+forms.map(f=>f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![\\p{L}])','u');
      let done=false;
      main=main.split(/(<[^>]+>)/).map(t=>done||t[0]==='<'?t:t.replace(re,(m,pre,w)=>{ done=true; return `${pre}<span class="gw" data-g="g${gn}" role="button" tabindex="0" aria-label="${w}: show its meaning">${w}</span>`; })).join('');
      if(!done) return;
      const src=`${d.a?d.a+', ':''}${up(d.w)}${d.y?' ('+d.y+')':''}, ${d.r}.`;
      notes+=`<p class="gdef" data-g="g${gn}"><button type="button" class="sig" aria-expanded="false"><span class="renvoi" aria-hidden="true">⁖</span> <span class="hw">${name}</span></button><span class="more"><span hidden="until-found">“${typo(d.q)}” ${src}${d.u?` <a href="${d.u}" target="_blank" rel="noopener">Read the whole</a>`:''}</span></span></p>`;
      gn++; });
    return main+html.slice(i).replace(/<\/aside>$/,notes+'</aside>'); };
  const lomb=(t,j)=>`<span class="lomb ${j%2?'red':'blue'}" aria-hidden="true">${t[0]}</span><span class="sr">${t[0]}</span>${t.slice(1)}`;

  const block=(b,j,first)=>{
    if(b.k==='scrip') return `<blockquote class="b b-scrip${b.text.split(' ').length>45?' long':''}"><span class="hq">“</span>${typo(b.text)}”<cite>${b.work==='King James Version'?b.ref:b.work+' '+b.ref}${b.work==='King James Version'||/King James/.test(b.tr||'')?' · KJV':''}</cite></blockquote><aside class="bg"></aside>`;
    if(b.k==='head') return `<h4 class="b b-head">${HEDERA}${b.text}</h4><aside class="bg"></aside>`;
    if(b.k==='ed') return `<p class="b b-ed">${b.text}</p><aside class="bg">${note('The editor.')}</aside>`;
    if(b.k==='chart') return N.chart?`${N.chart()}<aside class="bg">${note(N.chartNote)}</aside>`:'';
    const t=typo(b.text), body=first?lomb(t,j):t;
    const src=b.author+'|'+b.work, idem=src===lastSrc, c=cite(b,idem); lastSrc=src; lastRef=b.ref||'';
    if(b.k==='schaff') return `<p class="b b-sch${first?' inc':''}">${first?'':'<span class="pil" aria-hidden="true">¶ </span>'}${body}</p><aside class="bg">${note(c)}</aside>`;
    if(b.k==='reformed') return `<div class="b b-ref"><span class="lem">${LEM.reformed} · ${b.author}</span><p>${body}</p></div><aside class="bg">${note(c)}</aside>`;

    return `<div class="cat${p?' wp':''}">${head}<aside class="bg">${headNote}</aside>${p?`<div class="pcol" style="grid-row:1 / span ${span}">${plate(p)}</div>`:''}${rows}</div>`; };

    return gloss(`<p class="b b-sch"><span class="pil" aria-hidden="true">¶ </span>${t}</p><aside class="bg">${i===op.length-1?note(cite(q)):''}</aside>`,'opening',q.id); }).join('');

    ${PLATES.story?`<div class="pcol" style="grid-row:1">${plate(PLATES.story)}</div>`:''}<aside class="bg">${note('Each chapter is a chain of witnesses, as in the catenae of the period: excerpts in their own words, linked by Schaff’s narrative.')}${note(E.storyNote)}</aside></div>`);

  CH.forEach((c,j)=>{ const key='ch-'+c.n; let firstDone=false; lastSrc=''; lastRef='';
    const rows=c.blocks.map(b=>{ const f=!firstDone&&!['head','ed','scrip'].includes(b.k); if(f) firstDone=true; return gloss(block(b,j,f),c.n,b.id); });
    const heads=c.blocks.map((b,i)=>b.k==='head'?i:-1).filter(i=>i>2), mid=c.blocks.length/2;
    const split=heads.length?heads.reduce((a,i)=>Math.abs(i-mid)<Math.abs(a-mid)?i:a):-1;
    rows.push(`<div class="b explicit">${HEDERA}</div><aside class="bg">${c.read&&c.read.length?note('Read on: '+c.read.map(x=>x.url?`<a href="${x.url}" target="_blank" rel="noopener">${x.label}</a>`:x.label).join('; ')+'.'):''}</aside>`);
    leaf('story', key, catena(key, `<header class="b chhead"><span class="chn">Chapter ${ROMAN(c.n).toUpperCase()} · ${c.yrs}</span><h3>${c.title}</h3></header>`, rows, c.blocks.length+1, '', split)); });

  // Readings: how the Reformers read this era, in their own words
  const rd=X.readings||[];
  leaf('readings','readings', `<div class="cat"><div class="b"><span class="chn">Readings</span><h3>How the Reformers read this era</h3></div><aside class="bg">${note('Quoted, and labelled as interpretation, as the whole gold layer is.')}</aside>
    ${rd.map(q=>gloss(`<div class="b b-ref"><span class="lem">${q.author}</span><p>${typo(q.text)}</p></div><aside class="bg">${note(cite(q))}</aside>`,'readings',q.id)).join('')}</div>`);

/* ---------- The river is drawn from its spring ----------
   Each visit opens with the river drawn from Pentecost to today, its names appearing as it reaches them; any click, key, scroll or touch finishes it at once.
   Only a mask moves: the water itself is painted as always. */
(function drawFromSpring(){
  const ok=CSS.supports('mask-image','linear-gradient(#000,#000)')||CSS.supports('-webkit-mask-image','linear-gradient(#000,#000)');
  if(reduce||!ok||parseHash()?.i>=0) return;
  const els=[...riverLayers, labels, rib], D=2200, t0=performance.now(); let done=false;
  const set=m=>els.forEach(el=>{ el.style.webkitMaskImage=m; el.style.maskImage=m; });
  const at=p=>{ const a=p*110-10; set(`linear-gradient(90deg,#000 ${a.toFixed(2)}%,transparent ${(a+10).toFixed(2)}%)`); };
  const stop=['pointerdown','keydown','wheel','touchstart'];
  const end=()=>{ if(done) return; done=true; stop.forEach(t=>removeEventListener(t,end,true)); set(''); };
  stop.forEach(t=>addEventListener(t,end,true));
  const tick=now=>{ if(done) return; const p=Math.min(1,(now-t0)/D); at((1-Math.cos(Math.PI*p))/2); if(p<1) requestAnimationFrame(tick); else end(); };
  at(0); requestAnimationFrame(tick);
})();

    const pts=[]; for(let x=cx-total*.9; x<=cx+total*.9; x+=2){ const y=cy(id,x); if(y==null) continue; pts.push([x,y]); }
    if(pts.length<4) continue; const L=[0]; for(let i=1;i<pts.length;i++) L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
    let mid=0, bd=1e9; pts.forEach((p,i)=>{ const d=Math.abs(p[0]-cx); if(d<bd){ bd=d; mid=L[i]; } });
    const at=s=>{ let i=1; while(i<L.length-1&&L[i]<s) i++; const t=Math.max(0,Math.min(1,(s-L[i-1])/((L[i]-L[i-1])||1))), a=pts[i-1], b=pts[i]; return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, Math.atan2(b[1]-a[1],b[0]-a[0])]; };
    let s=mid-total/2;
    chars.forEach((c,k)=>{ const w=adv[k]-ls*fs, [x,y,ang]=at(s+w/2); ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
      ctx.lineWidth=2.6; ctx.lineJoin='round'; ctx.strokeStyle=`rgba(${S.paper},.6)`; ctx.strokeText(c,0,fs*.34); ctx.fillStyle='#241f1a'; ctx.fillText(c,0,fs*.34); ctx.restore(); s+=adv[k]; }); }
}
landReady=true; layoutLand();

requestAnimationFrame(frame);
})();
</script>
